    - bbox: {size: [30, 30, 15], tol: 0.4}
    - bodies: 1
    - slice: {z: 6, islands: 1, holes: 1, hole_area: [24.6, 0.12]}
    - slice: {z: 13, islands: 1, holes: 0}
    - arc: {z: 7, center: [0, 0], r: 14.6, gaps: 18}
