    motor's centring boss with its centre at x = 0, z = 28, and four 3.4 mm holes
    for M3 screws on a 31 mm square pattern centred on the boss hole. Add two
    triangular gussets, 5 mm thick, flush with the left and right edges
    (x = -25 to -20 and x = 20 to 25): each is a right triangle in the YZ plane
    with legs 20 mm along +Y and 20 mm along +Z, its right-angle corner at y = 5,
    z = 5 (where the plates meet).
