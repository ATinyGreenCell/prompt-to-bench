    - probes: {empty: [[0, 43.75, 36], [0, 0, 20]],
               solid: [[0, -43.75, 36], [43.75, 0, 36], [-43.75, 0, 36], [0, 0, 1]]}
    - volume: {rel_tol: 0.05}

- id: nema17_motor_bracket
  category: hardware
