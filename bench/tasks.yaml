    - bodies: 1
    - slice: {z: 12.5, islands: 1, holes: 0, island_d: [8, 0.3]}
    - slice: {z: 10, islands: 1, island_d: [6, 0.3]}
    - slice: {z: 53.5, islands: 1, island_d: [5.5, 0.35]}
    - slice: {z: 63, islands: 1}
    - volume: {rel_tol: 0.06}

- id: lab_funnel_60mm
  category: tools
  title: 60 mm lab funnel
  short: funnel
  reference: bench/reference/lab_funnel_60mm.scad
  library: designs/tools/lab_funnel_60mm.scad
  skills: [hollow solid of revolution, open ends, wall thickness]
  prompt: >-
    Design a small lab funnel, printed upright with the wide opening at the top. A
    straight spout (tube) with 10 mm outer diameter runs from z = 0 to z = 20. On
    top of it, a cone widens from 10 mm outer diameter at z = 20 to 60 mm outer
    diameter at the rim at z = 50. The wall is 1.6 mm thick everywhere (so the
    spout's bore is 6.8 mm), and the funnel is open at the top and at the bottom so
    liquid runs straight through.
  checks:
    - bbox: {size: [60, 60, 50], tol: 0.5}
    - bodies: 1
    - slice: {z: 10, islands: 1, holes: 1, island_d: [10, 0.3], hole_d: [6.8, 0.3]}
    - slice: {z: 35, islands: 1, holes: 1, island_d: [35, 0.6], hole_d: [31.4, 0.8]}
    - slice: {z: 49.5, islands: 1, holes: 1, hole_d: [55.5, 0.9]}
    - probes: {empty: [[0, 0, 0.3], [0, 0, 15], [0, 0, 30], [0, 0, 49.7]]}
    # "1.6 mm everywhere" can be read horizontally (reference, 1.23 mm normal to the cone)
    # or normal to the cone (+24 % volume); both are correct, so volume is loose here.
    - volume: {rel_tol: 0.35}

