              hole_centers: [[35.75, 35.75], [-35.75, 35.75], [35.75, -35.75], [-35.75, -35.75]], tol: 0.4}
    - slice: {z: 20, islands: 1, holes: 1, hole_rects: [[85, 85]], rect_tol: 0.4}
