  short: D-shaft knob
  reference: bench/reference/dshaft_knob_6mm.scad
  library: designs/quick-fixes/dshaft_knob_6mm.scad
  skills: [D-profile bore, polar array, feature alignment]
  prompt: >-
    Design a replacement knob for a hotplate stirrer with a 6 mm D-shaft. The knob
    is a cylinder 30 mm in diameter and 15 mm tall. It is printed with the side that
    faces the hotplate down on the bed (z = 0). From that bottom face, a D-shaped
    blind bore goes 12 mm up into the knob: a 6.2 mm diameter circle with one side
    cut flat, so the distance from the flat to the opposite side of the circle is
    4.7 mm. Around the outside, cut 18 evenly spaced vertical grip grooves along
    the full height; each groove is a 2 mm diameter half-cylinder centred on the
    outer surface. On the top face, cut a pointer groove 1.5 mm wide and 1 mm deep
    that runs from the centre to the outer edge, on the same side as the flat of
    the D.
