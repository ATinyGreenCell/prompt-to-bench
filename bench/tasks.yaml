  short: motor bracket
  reference: bench/reference/nema17_motor_bracket.scad
  library: designs/hardware/nema17_motor_bracket.scad
  skills: [L-bracket, horizontal holes, bolt patterns, gussets]
  prompt: >-
    Design an L-shaped mounting bracket for a NEMA 17 stepper motor, e.g. for a
    syringe pump. Print orientation: the base plate lies on the bed. Base plate:
    x from -25 to 25, y from 0 to 45, z from 0 to 5, with two 4.5 mm vertical
    through-holes (M4) at (x = -17, y = 30) and (x = 17, y = 30). Vertical motor
    plate: x from -25 to 25, y from 0 to 5, z from 0 to 50, standing on the back
