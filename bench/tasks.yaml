    - line: {z: 0.75, from: [-36, 6], to: [36, 6], intervals: 1, length: [70, 0.5]}
    - volume: {rel_tol: 0.05}

- id: micropestle_1p5ml
  category: tools
  title: Micropestle for 1.5 mL tubes
  short: micropestle
  reference: bench/reference/micropestle_1p5ml.scad
  library: designs/tools/micropestle_1p5ml.scad
  skills: [stacked primitives, cone, grooves at given heights]
  prompt: >-
    Design a pestle for grinding tissue inside a 1.5 mL microcentrifuge tube,
    printed standing upright. From bottom to top: (1) a cylindrical handle 8 mm in
    diameter from z = 0 to z = 45; (2) a cone that tapers from 8 mm diameter at
