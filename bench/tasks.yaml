  title: Magnetic stirrer housing for an 80 mm PC fan
  short: stirrer housing
  reference: bench/reference/stirrer_fan_housing.scad
  library: designs/hardware/stirrer_fan_housing.scad
  skills: [shelled box, bolt pattern, print orientation, edge notch]
  prompt: >-
    Design the housing for a DIY magnetic stirrer built from an 80 mm PC case fan.
    In use it is an upside-down open box that covers the fan, and its closed top is
    the stirring surface. Model it in print orientation, i.e. upside down: the
    2 mm thick top plate lies on the bed (z = 0 to 2) and four walls, 2.5 mm thick,
    rise from it to z = 40, where the box is open. The outer size is 90 x 90 mm
    (X x Y). Drill four 4.5 mm holes for M4 screws through the top plate on a
    71.5 mm square pattern centred on the plate (the fan's mounting holes). In one
    wall, cut a notch for the power cable: 12 mm wide, centred along the wall,
    reaching 8 mm down from the open edge (from z = 32 to z = 40).
