    - volume: {rel_tol: 0.06}

- id: rod_tubing_clip
  category: quick-fixes
  title: Snap-on tubing clip for a lab stand rod
  short: rod clip
  reference: bench/reference/rod_tubing_clip.scad
  library: designs/quick-fixes/rod_tubing_clip.scad
  skills: [2-D profile booleans, open rings, explicit coordinates]
  prompt: >-
    Design a snap-on clip that holds a piece of tubing next to a 12.7 mm (1/2 inch)
    lab stand rod. It is printed flat: a 10 mm tall extrusion (Z) of a 2-D profile
    in the XY plane. The profile consists of: (1) a rod ring with 12.7 mm inner
    diameter and 3 mm wall (18.7 mm outer diameter), centred at the origin, with a
    10 mm wide opening cut out of its -X side (everything with x < 0 and
    -5 < y < 5 is removed from this ring) so it snaps onto the rod; (2) a tubing
    ring with 6 mm inner diameter and 2 mm wall, centred at x = 15, y = 0, with a
    4.5 mm wide opening cut out of its +X side (x > 15 and -2.25 < y < 2.25);
    (3) a solid bridge 6 mm wide (Y) between x = 8 and x = 12 that joins the two
    rings without blocking either ring's hole.
  checks:
    - bbox: {size: [27.37, 18.7, 10], tol: 0.4}
    - bodies: 1
    - slice: {z: 5, islands: 1, holes: 0, material_area: 0.05}
    - probes: {empty: [[0, 0, 5], [15, 0, 5], [-7.5, 0, 5], [19, 0, 5]],
               solid: [[0, 7.8, 5], [0, -7.8, 5], [15, 4, 5], [15, -4, 5], [10, 0, 5], [-5.5, 6, 5]]}
    - volume: {rel_tol: 0.05}

- id: stirrer_fan_housing
