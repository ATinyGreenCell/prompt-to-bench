# Prompt-to-Bench task set: 16 biology-lab parts, 4 per category.
# `prompt` is exactly what the model sees (after the system prompt).
# `checks` are hidden; coordinates are in the design frame of `reference`
# (the part as the prompt describes it, lowest point at z = 0).
# Reference values for relative checks (volume, slice areas) come from the
# rendered reference solution - see build_refs.py.

- id: tube_rack_1p5ml
  category: benchware
  title: 24-place 1.5 mL tube rack
  short: 1.5 mL rack
  reference: bench/reference/tube_rack_1p5ml.scad
  library: designs/benchware/tube_rack_1p5ml.scad
  skills: [block, blind holes, 2-D hole grid]
  prompt: >-
    Design a bench rack for 1.5 mL microcentrifuge tubes. It is a solid rectangular
    block 106 mm long (X), 72 mm wide (Y) and 30 mm tall (Z). It has 24 vertical
    holes in 4 rows (along Y) of 6 holes (along X), 16 mm centre-to-centre in both
    directions, with the hole grid centred on the block. Each hole is 11.2 mm in
    diameter and 25 mm deep, open at the top and closed at the bottom, leaving a
    5 mm solid floor.
  checks:
    - bbox: {size: [106, 72, 30], tol: 0.5}
    - bodies: 1
    - slice: {z: 15, islands: 1, holes: 24, hole_d: [11.2, 0.4],
              hole_grid: {nx: 6, ny: 4, px: 16, py: 16}, tol: 0.5}
    - slice: {z: 2.5, islands: 1, holes: 0}
    - volume: {rel_tol: 0.05}

- id: conical_rack_50ml
  category: benchware
  title: 50 mL conical tube rack, printed inverted
  short: 50 mL rack
  reference: bench/reference/conical_rack_50ml.scad
  library: designs/benchware/conical_rack_50ml.scad
  skills: [print orientation, through holes, multi-feature union]
  prompt: >-
    Design a rack for six 50 mL conical (Falcon-type) tubes. It is printed upside
    down and flipped over after printing. In print orientation: a flat plate 130 mm
    (X) by 90 mm (Y) and 4 mm thick lies on the bed (z = 0 to 4). The plate has six
    through-holes, 30.5 mm in diameter, in 2 rows (along Y) of 3 (along X), 40 mm
    centre-to-centre in both directions, centred on the plate. Two solid walls run
    along the two long edges of the plate: each wall is 130 mm long (X) and 4 mm
    thick (Y), flush with the plate's long edge, and rises from the plate to
    z = 70. The two short ends stay open. After flipping, the rack stands on the
    two walls and the tubes pass through the holes.
  checks:
    - bbox: {size: [130, 90, 70], tol: 0.5}
    - bodies: 1
    - slice: {z: 2, islands: 1, holes: 6, hole_d: [30.5, 0.5],
              hole_grid: {nx: 3, ny: 2, px: 40, py: 40}, tol: 0.6}
    - slice: {z: 40, islands: 2, island_rects: [[130, 4], [130, 4]], island_tol: 0.4}
    - probes: {solid: [[0, 43, 40], [0, -43, 40], [0, 0, 2]],
               empty: [[0, 0, 40], [63, 0, 40], [0, 20, 2]]}
    - volume: {rel_tol: 0.05}

- id: slide_drying_rack
  category: benchware
  title: Microscope slide drying rack
  short: slide rack
  reference: bench/reference/slide_drying_rack.scad
  library: designs/benchware/slide_drying_rack.scad
  skills: [thin slots, 1-D array, small clearances]
  prompt: >-
    Design a drying rack that holds 10 microscope slides (75 x 25 x 1 mm) standing
    upright on their long edge. It is a solid base block 90 mm long (X), 45 mm wide
    (Y) and 20 mm tall (Z). Cut 10 parallel slots into the top face: each slot runs
    along X, is 77 mm long, 1.6 mm wide (Y) and 10 mm deep, open at the top. The
    slots are 3.5 mm apart centre-to-centre (in Y), and the group of slots is
    centred on the block in X and Y.
  checks:
    - bbox: {size: [90, 45, 20], tol: 0.5}
    - bodies: 1
    - slice: {z: 15, islands: 1, holes: 10, hole_rect: [77, 1.6, 0.6, 0.25],
              hole_centers: [[0, -15.75], [0, -12.25], [0, -8.75], [0, -5.25], [0, -1.75],
                             [0, 1.75], [0, 5.25], [0, 8.75], [0, 12.25], [0, 15.75]], tol: 0.4}
    - slice: {z: 5, islands: 1, holes: 0}
    - volume: {rel_tol: 0.05}

- id: pcr_tube_rack_sbs
  category: benchware
  title: 96-place PCR tube rack, SBS footprint
  short: 96 PCR rack
  reference: bench/reference/pcr_tube_rack_sbs.scad
  library: designs/benchware/pcr_tube_rack_sbs.scad
  skills: [standard footprint, large grid, asymmetric feature]
  prompt: >-
    Design a rack for 96 PCR tubes (0.2 mL) with the standard microplate (ANSI/SLAS)
    footprint: a block 127.76 mm long (X), 85.48 mm wide (Y) and 20 mm tall (Z). It
    has 96 vertical through-holes, 6.2 mm in diameter, in 8 rows (along Y) by 12
    columns (along X) at 9.0 mm centre-to-centre spacing. The centre of the first
    hole (A1) is 14.38 mm from the left edge and 11.24 mm from the back edge, so the
    grid is centred on the block. Cut a 45-degree chamfer with 5 mm legs off the
    vertical edge at the A1 corner as an orientation mark.
  checks:
    - bbox: {size: [127.76, 85.48, 20], tol: 0.5}
    - bodies: 1
    - slice: {z: 10, islands: 1, holes: 96, hole_d: [6.2, 0.3],
              hole_grid: {nx: 12, ny: 8, px: 9, py: 9}, tol: 0.4}
    - slice: {z: 1, holes: 96}
    - probes: {empty: [[-62.88, 41.74, 10]],
               solid: [[62.88, 41.74, 10], [62.88, -41.74, 10], [-62.88, -41.74, 10]]}
    - volume: {rel_tol: 0.05}

