name: Chinese translation validation (temporary reviewer check)
on:
  push:
    branches:
      - feature/zh-labware-benchmark-prompts
  workflow_dispatch:
permissions:
  contents: read
jobs:
  translation-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install YAML parser
        run: python -m pip install pyyaml==6.0.3
      - name: Regress translation completeness and signed geometry
        run: python -m unittest bench.prompts.test_validate_zh -v
      - name: Audit shipped Chinese translations
        run: python bench/prompts/validate_zh.py
