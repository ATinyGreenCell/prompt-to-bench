name: Chinese labware benchmark integrity

on:
  push:
    branches:
      - feature/zh-labware-benchmark-prompts
  workflow_dispatch:

permissions:
  contents: read

jobs:
  chinese-prompt-and-failure-propagation:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install no-model validation dependency
        run: python -m pip install PyYAML
      - name: Validate Bash and fail-closed language runner tests
        run: |
          bash -n bench/run_lang.sh
          python -m unittest -v bench.prompts.test_validate_zh
      - name: Validate all currently translated task constraints
        run: python bench/prompts/validate_zh.py
